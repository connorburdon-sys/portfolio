<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Portfolio admin</title>
  <link rel="stylesheet" href="css/admin.css" />
  <script type="module" src="js/admin.js"></script>
</head>

<body>
  <main>
    <a href="index.html">← Portfolio</a>
    <h1>Portfolio admin</h1>
    <form id="login-form">
      <h2>Sign in</h2>
      <input name="username" value="admin" aria-label="Username" required />
      <input name="password" type="password" placeholder="Password" aria-label="Password" required />
      <button>Sign in</button>
      <p id="login-status"></p>
    </form>
    <section id="admin" hidden>
      <button id="logout" class="plain">Sign out</button>
      <h2>Projects</h2>
      <form id="project-form">
        <input name="name" placeholder="Project name" required />
        <input name="year" type="number" placeholder="Year" min="1900" max="2200" required />
        <select name="schoolYear" aria-label="School year" required>
          <option value="">School year</option>
          <option value="First year">First year</option>
          <option value="Second year">Second year</option>
        </select>
        <textarea name="description" placeholder="Description" required></textarea>
        <input name="stack" placeholder="Skills, separated by commas" required />
        <input name="link" type="url" placeholder="Project URL (optional)" />
        <label>Project image <input name="image" type="file" accept="image/png,image/jpeg,image/webp,image/gif"
            required /></label>
        <button>Add project</button>
      </form>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Project</th>
              <th>Link</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="projects"></tbody>
        </table>
      </div>
      <h2>Skills</h2>
      <form id="skill-form">
        <input name="name" placeholder="Skill name" required />
        <button>Add skill</button>
      </form>
      <ul id="skills"></ul>
      <p id="status" role="status"></p>
    </section>
  </main>
</body>

</html>
