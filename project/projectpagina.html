<!DOCTYPE html>
<html lang="en">
<link rel="icon" type="icon" href="/images/logo.jpg">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <link rel="stylesheet" href="projectpagina.css">
  <link rel="stylesheet" href="/common.css">


</head>

<body>
  <header>
    <h1><b>Mijn portfolio<br>Projecten</b></h1>
    <nav>
      <a class="link" href="../index.html">Home</a>
      <a class="link" href="../index.html#base2">Over mij</a>
      <a class="link" href="/Contact/contact.html">contact</a>
    </nav>
  </header>

  <main class="base">
    <button class="btn" id="prev" aria-label="Vorige project">‹</button>

    <section class="image-box">
      <div class="frame">
        <a id="link" target="_blank" href="https://604915.klas4s25.ictcollege-amersfoort.nl/Gamecraft/">
          <img class="img" id="img" src="/images/Gamecraft.png" alt="Gamecraft">
        </a>
      </div>
    </section>

    <section class="text">
      <h2 id="title">Gamecraft</h2>
      <p id="tekst">
        voor dit project heb ik voor het eerst in een team gewerkt. de opdracht was om
        met HTML, CSS en JS een site te maken waarop er games gehost moesten worden.
      </p>
      <div class="dots" id="dots" aria-label="Project navigatie"></div>
    </section>

    <button class="btn" id="next" aria-label="Volgende project">›</button>
  </main>

  <script>
    const projects = [
      {
        title: "Gamecraft",
        text: "voor dit project heb ik voor het eerst in een team gewerkt. de opdracht was om met HTML, CSS en JS een site te maken waarop er games gehost moesten worden.",
        image: "/images/Gamecraft.png",
        alt: "Gamecraft",
        link: "https://604915.klas4s25.ictcollege-amersfoort.nl/Gamecraft/"
      },
      {
        title: "Het Goede Doel",
        text: "dit project was een website voor een goed doel. ik heb hier vooral gewerkt aan de layout, styling en het duidelijk presenteren van de informatie.",
        image: "/images/goededoel.png",
        alt: "Het Goede Doel",
        link: "https://604915.klas4s25.ictcollege-amersfoort.nl/goededoel/"
      },
      {
        title: "Rythm +",
        text: "bij dit project heb ik gewerkt aan een spelwebsite. hierbij heb ik vooral geleerd hoe je interactie toevoegt met HTML, CSS en JavaScript.",
        image: "/images/game.png",
        alt: "Rythm Plus",
        link: "https://604915.klas4s25.ictcollege-amersfoort.nl/Game/"
     },
     {
       title: "Gastenboek",
       text: "dit project was een gastenboek waar bezoekers berichten kunnen achterlaten. ik heb hier met PHP en sql gewerkt om de berichten op te slaan en weer te geven.",
       image: "/images/gastenboek.png",
       alt: "Gastenboek",
       link: "https://604915.klas4s25.ictcollege-amersfoort.nl/gastenboek/gastenboek/"
     },
     {
       title:"Ergowijzer",
       text:"dit project ging over een gezonde werkplek met beeldschermen. ik heb hier vooral gewerkt aan het ontwerp en de presentatie van de informatie. Dit was mijn tweede groepsproject.",
       image:"/images/ergo.png",
       alt:"Ergowijzer",
       link:"https://604915.klas4s25.ictcollege-amersfoort.nl/Ergowijzer/"
     }
    ];

    const t = document.getElementById("title");
    const txt = document.getElementById("tekst");
    const img = document.getElementById("img");
    const link = document.getElementById("link");
    const dots = document.getElementById("dots");
    const box = document.querySelector(".base");
    const p = document.getElementById("prev");
    const n = document.getElementById("next");

    let current = 0;
    let timer;

    function renderDots() {
      dots.innerHTML = "";
      projects.forEach((_, index) => {
        const dot = document.createElement("button");
        dot.type = "button";
        dot.className = index === current ? "dot active" : "dot";
        dot.setAttribute("aria-label", `Ga naar project ${index + 1}`);
        dot.addEventListener("click", () => {
          current = index;
          updateProject();
          restartAutoRotate();
        });
        dots.appendChild(dot);
      });
    }

    function updateProject() {
      const project = projects[current];
      box.classList.remove("fade");
      void box.offsetWidth;
      box.classList.add("fade");

      t.textContent = project.title;
      txt.textContent = project.text;
      img.src = project.image;
      img.alt = project.alt;
      link.href = project.link;

      [...dots.children].forEach((dot, index) => {
        dot.classList.toggle("active", index === current);
      });
    }

    function nextProject() {
      current = (current + 1) % projects.length;
      updateProject();
    }

    function prevProject() {
      current = (current - 1 + projects.length) % projects.length;
      updateProject();
    }

    function restartAutoRotate() {
      clearInterval(timer);
      timer = setInterval(nextProject, 4500);
    }

    p.addEventListener("click", () => {
      prevProject();
      restartAutoRotate();
    });

    n.addEventListener("click", () => {
      nextProject();
      restartAutoRotate();
    });

    box.addEventListener("mouseenter", () => clearInterval(timer));
    box.addEventListener("mouseleave", restartAutoRotate);

    renderDots();
    updateProject();
    restartAutoRotate();
  </script>

</body>
</html>
